<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Hour</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #333;
        }
        a {
            display: block;
            margin: 1rem auto;
            padding: 0.8rem 1.5rem;
            width: 250px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        a:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, Welcome to Normal Hour</h1>
        <a href="https://github.com/normalhour" target="_blank">GitHub</a>
        <a href="https://normalhour.github.io/chronicles" target="_blank">Chronicles</a>
        <a href="https://discord.gg/33tUAHpTgR" target="_blank">Discord</a>
    </div>
</body>
</html>
